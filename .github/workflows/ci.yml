name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Clean install from declared dependencies only (gaps.md § 1.4). If this fails, a dependency is missing.
      - run: pip install -e ".[dev]"
      - name: design gate (design.md must exist)
        run: test -f design.md
      - name: secret scan (no keys or private keys committed)
        run: |
          if grep -rEn --exclude-dir=.git --exclude-dir=.pytest_cache \
               -e 'sk-[A-Za-z0-9]{20,}' -e 'AKIA[0-9A-Z]{16}' \
               -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' .; then
            echo "possible secret found"; exit 1
          fi
      # Lexical backend: CI does not download models. The neural path is covered by eval/ on a model host.
      - name: unit, contract, integration, tenancy, chaos
        env:
          RETRIEVAL_BACKEND: lexical
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: build API image
        run: docker build -t unreliable-assistant:ci .
