[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unreliable-assistant"
version = "0.2.0"
description = "Enterprise agentic assistant: grounded RAG, bounded loops, HITL-gated actions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn>=0.29",
  "numpy>=1.26",  # imported at module load by rag/dense.py
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Neural retrieval (default RETRIEVAL_BACKEND=full). Without this extra, set RETRIEVAL_BACKEND=lexical.
models = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
ui = ["streamlit>=1.37"]  # optional developer workbench; not part of the deployed service

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
